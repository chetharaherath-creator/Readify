<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Readify | Recommender</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="image/icon.png">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="recommender.css">
</head>

<body>

  <!-- ===== NAVBAR ===== -->
  <header class="site-header">
    <nav class="nav">
      <div class="logo">Readify</div>

      <button class="nav-toggle">
        <span class="nav-line"></span>
        <span class="nav-line"></span>
        <span class="nav-line"></span>
      </button>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="book-explorer.html">Books</a></li>
        <li><a href="progress.html">Tracker</a></li>
        <li><a href="recommender.html" class="active">Recommender</a></li>
        <li><a href="reading-flow.html">Reading Flow</a></li>
        <li><a href="feedback.html">Feedback</a></li>
      </ul>
    </nav>
  </header>

  <!-- ===== PAGE BANNER ===== -->
  <section class="recommender-banner">
    <h1>Random Book Recommender</h1>
    <p>Let us choose your next read.</p>
  </section>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="recommender-page">

    <div class="recommender-box">

      <label>Genre</label>
      <select id="genreSelect">
        <option value="all">All</option>
        <option value="fiction">Fiction</option>
        <option value="fantasy">Fantasy</option>
        <option value="romance">Romance</option>
        <option value="travel">Travel</option>
        <option value="selfhelp">Self-help</option>
        <option value="reference">Reference</option>
      </select>

      <label>Length</label>
      <select id="lengthSelect">
        <option value="all">All</option>
        <option value="short">Short</option>
        <option value="medium">Medium</option>
        <option value="long">Long</option>
      </select>

      <button id="recommendBtn" class="btn-primary big-btn">
        Recommend
      </button>

      <!-- RESULT -->
      <div id="recommendResult" class="recommend-result"></div>

      <button id="pickAgainBtn" class="btn-secondary big-btn" style="display:none;">
       Pick Again
      </button>

      <button id="saveRecommendBtn" class="btn-secondary big-btn" style="display:none;">
       Save to Reading List
      </button>


    </div>

  </main>

  <!-- ===== FOOTER (SAME AS OTHER PAGES) ===== -->
  <footer class="site-footer">
    <div class="footer-left">
      <h3>Readify</h3>
      <p>Simple, calm book recommendations and reading tools.</p>
      <p>Negombo, Sri Lanka</p>
    </div>

    <div class="footer-right">
      <h4>Connect with Readify</h4>

      <form class="newsletter-form">
        <label>Email</label>
        <input type="email" placeholder="you@example.com">

        <div class="newsletter-checkbox">
          <input type="checkbox">
          <label>Yes, subscribe me to your newsletter.</label>
        </div>

        <button class="btn-primary">Submit</button>
      </form>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="recommender.js"></script>
</body>
</html>
