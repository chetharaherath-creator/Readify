<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Readify | Reading Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="image/icon.png">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="progress.css">
</head>

<body>

  <!-- NAVBAR -->
  <header class="site-header">
    <nav class="nav">
      <div class="logo">Readify</div>

      <button class="nav-toggle">
        <span class="nav-line"></span>
        <span class="nav-line"></span>
        <span class="nav-line"></span>
      </button>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="book-explorer.html">Books</a></li>
        <li><a href="progress.html" class="active">Tracker</a></li>
        <li><a href="recommender.html">Recommender</a></li>
        <li><a href="reading-flow.html">Reading Flow</a></li>
        <li><a href="feedback.html">Feedback</a></li>
      </ul>
    </nav>
  </header>

  <!-- BANNER -->
  <section class="tracker-banner">
    <h1>Reading Progress Tracker</h1>
    <p>See how far you are in your book</p>
  </section>

  <!-- CONTENT -->
  <main class="tracker-page">

    <div class="tracker-box">

      <label>Total pages</label>
      <input type="number" id="totalPages">

      <label>Pages read</label>
      <input type="number" id="pagesRead">

      <label>Pages per day</label>
      <input type="number" id="pagesPerDay">

      <button id="calcBtn" class="btn-primary big-btn">
        Calculate
      </button>

      <button id="saveProgressBtn" class="btn-secondary">Save Progress</button>

      <!-- RESULT -->
      <div id="trackerResult" class="result-box"></div>

    </div>

  </main>

  <!-- FOOTER (SAME AS YOUR OTHER PAGES) -->
  <footer class="site-footer">
    <div class="footer-left">
      <h3>Readify</h3>
      <p>Simple, calm book recommendations and reading tools.</p>
      <p>Negombo, Sri Lanka</p>
    </div>

    <div class="footer-right">
      <h4>Connect with Readify</h4>

      <form class="newsletter-form">
        <label>Email</label>
        <input type="email">

        <div class="newsletter-checkbox">
          <input type="checkbox">
          <label>Yes, subscribe me to your newsletter.</label>
        </div>

        <button class="btn-primary">Submit</button>
      </form>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="progress.js"></script>

</body>
</html>
